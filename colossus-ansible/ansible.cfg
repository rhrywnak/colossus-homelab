[defaults]
# Inventory
inventory = inventory/hosts.yml

# SSH settings for CoreOS VMs
remote_user = core
host_key_checking = False

# Performance
forks = 10
pipelining = True

# Output
stdout_callback = yaml
callbacks_enabled = timer

# Vault
# vault_password_file = ~/.ansible/vault-pass  # Uncomment to avoid --ask-vault-pass

# Roles path
roles_path = roles

# Retry files (don't litter the directory)
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
# SSH multiplexing — critical for pve-1 igc NIC issue
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=~/.ssh/ansible-%r@%h:%p
# Longer timeout for CoreOS VMs that may be rebooting
timeout = 30
