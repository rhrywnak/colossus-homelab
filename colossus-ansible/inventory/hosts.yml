---
# Colossus Homelab Inventory
#
# Groups:
#   proxmox_hosts  — Proxmox hypervisors (pve-1, pve-2, pve-3)
#   db_vms         — Database VMs (VM-110, VM-210)
#   app_vms        — Application VMs (VM-120, VM-220)  [Phase 4A]
#   dev            — All DEV environment machines
#   prod           — All PROD environment machines

all:
  children:
    # ── Proxmox Hypervisors ──────────────────────────────────
    proxmox_hosts:
      hosts:
        pve-1:
          ansible_host: 10.10.100.3
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          proxmox_role: prod
        pve-2:
          ansible_host: 10.10.100.4
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          proxmox_role: dev
        pve-3:
          ansible_host: 10.10.100.5
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          proxmox_role: mgmt

    # ── Database VMs ─────────────────────────────────────────
    db_vms:
      hosts:
        colossus-prod-db1:
          ansible_host: 10.10.100.110
          vmid: 110
          proxmox_node: pve-1
        colossus-dev-db1:
          ansible_host: 10.10.100.200
          vmid: 210
          proxmox_node: pve-2
      vars:
        ansible_user: core
        ansible_python_interpreter: /usr/bin/python3

    # ── Application VMs ──────────────────────────────────────
    # Uncomment when VMs are created (Phase 4A)
    app_vms:
      hosts:
        # colossus-prod-app1:
        #   ansible_host: 10.10.100.120
        #   vmid: 120
        #   proxmox_node: pve-1
        # colossus-dev-app1:
        #   ansible_host: 10.10.100.220
        #   vmid: 220
        #   proxmox_node: pve-2
        placeholder: {}  # Remove when real hosts are added
      vars:
        ansible_user: core
        ansible_python_interpreter: /usr/bin/python3

    # ── Environment Groups ───────────────────────────────────
    # These map machines to environments for -l dev / -l prod filtering
    dev:
      hosts:
        colossus-dev-db1: {}
        # colossus-dev-app1: {}   # Uncomment when created
    prod:
      hosts:
        colossus-prod-db1: {}
        # colossus-prod-app1: {}  # Uncomment when created
